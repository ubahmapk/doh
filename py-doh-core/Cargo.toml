[package]
name = "py-doh-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ubahmapk/doh"
description = "Python bindings for doh-core: a DNS client library for DoH, DoT, and DoQ"
publish = false

[lib]
name = "py_doh_core"
crate-type = ["cdylib"]

[dependencies]
doh-core = { path = "../doh-core" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pyo3-log = "0.13"
tokio = { version = "1", features = ["rt-multi-thread"] }
log = "0.4"
