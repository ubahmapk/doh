[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "py-doh-core"
version = "0.1.0"
description = "Python bindings for doh-core: a DNS client library for DoH, DoT, and DoQ"
readme = "doh.md"
license = "MIT"
license-files = []
authors = [{ name = "Jon Mark Allen", email = "ubahmapk@gmail.com" }]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Internet :: Name Service (DNS)",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ubahmapk/doh"
Repository = "https://github.com/ubahmapk/doh"
Changelog = "https://github.com/ubahmapk/doh/blob/main/CHANGELOG.md"

[tool.maturin]
module-name = "py_doh_core"

[dependency-groups]
dev = [
    "ipython>=8.18.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
