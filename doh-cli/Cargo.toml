[package]
name = "doh-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A command-line DNS client for DoH, DoT, and DoQ, with q-like output formatting (pretty, column, json, yaml, raw) and no fallback to classic plaintext DNS"
readme = "README.md"
keywords = ["dns", "doh", "cli", "dot", "doq"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "doh"
path = "src/main.rs"

[dependencies]
doh-core = { path = "../doh-core", version = "0.3.1" }
tokio = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
directories = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
