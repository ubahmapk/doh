[workspace]
resolver = "2"
members = ["doh-core", "doh-cli"]
# py-doh-core is a PyO3 extension-module crate: it needs maturin's linker
# setup (Python symbols resolved at import time, not link time), so plain
# `cargo build`/`cargo test --workspace` can't build it -- confirmed this
# breaks the link step otherwise. Excluded so it's built independently via
# `cd py-doh-core && maturin develop`, with its own Cargo.lock.
exclude = ["py-doh-core"]

[workspace.package]
version = "0.3.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ubahmapk/doh"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "http2", "query", "stream"] }
futures-util = { version = "0.3", default-features = false }
hickory-proto = "0.26"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
base64 = "0.23"
async-trait = "0.1"
wiremock = "0.6"
rustls = "0.23"
rustls-native-certs = "0.8"
rustls-pki-types = "1"
tokio-rustls = "0.26"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
toml = "1"
directories = "6"
log = "0.4"
